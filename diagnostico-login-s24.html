<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico Meu Inglês</title><style>body{font:16px system-ui;background:#071624;color:#e7f5ff;padding:25px;line-height:1.5}pre{white-space:pre-wrap;background:#10253a;padding:16px;border-radius:12px}button{padding:14px;background:#1488dc;color:white;border:0;border-radius:10px}</style><h2>Diagnóstico de conexão do Meu Inglês</h2><p>Teste sem senha. Nenhuma conta será alterada.</p><button id="start">Verificar conexão</button><pre id="out">Aguardando...</pre><script>const base='https://earl-electoral-employers-usgs.trycloudflare.com',el=document.querySelector('#out');async function test(){let report='Origem: '+location.origin+'\nServidor: '+base+'\n';for(const [name,path,options] of [['Saúde','/healthz',{method:'GET'}],['Preflight','/__turbo/panel-login',{method:'OPTIONS',headers:{'access-control-request-method':'POST','access-control-request-headers':'content-type'}}],['Login de teste (senha falsa)','/__turbo/panel-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:'diagnostico',password:'senha-falsa-diagnostico'})}]]){try{let r=await fetch(base+path,{...options,cache:'no-store',signal:AbortSignal.timeout(12000)});let t=await r.text();report+=name+': HTTP '+r.status+' | CORS '+(r.headers.get('access-control-allow-origin')||'não informado')+' | '+t.slice(0,160)+'\n';}catch(e){report+=name+': ERRO '+e.message+'\n';}el.textContent=report;}}document.querySelector('#start').onclick=test;test();</script></html>
