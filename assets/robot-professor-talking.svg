<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%" role="img" aria-label="Robô professor falando">
  <defs>
    <radialGradient id="cyanGlowTalk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#00a6ff" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headBodyGradTalk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="screenGradTalk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#001f3f"/>
    </linearGradient>
    <filter id="neonGlowTalk" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlowTalk" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .body-talk{transform-box:fill-box;transform-origin:center;animation:bodyTalk 2.3s ease-in-out infinite}
      .head-talk{transform-box:fill-box;transform-origin:50% 62%;animation:headTalk 2s ease-in-out infinite}
      .waving-arm-talk{transform-box:fill-box;transform-origin:20% 70%;animation:waveTalk 2s ease-in-out infinite}
      .eye-left,.eye-right{transform-box:fill-box;transform-origin:center}
      .eye-left{animation:eyeLeftLife 4.2s ease-in-out infinite}
      .eye-right{animation:eyeRightLife 4.2s ease-in-out infinite}
      .mouth-bars{animation:mouthGlow .7s ease-in-out infinite}
      @keyframes bodyTalk{
        0%,100%{transform:translateY(0) scale(1)}
        22%{transform:translateY(-2px) scale(1.01)}
        48%{transform:translateY(2px) scale(.995)}
        75%{transform:translateY(-1px) scale(1.006)}
      }
      @keyframes headTalk{
        0%,100%{transform:translate(0,0) rotate(0deg)}
        18%{transform:translate(-2px,-2px) rotate(-2deg)}
        38%{transform:translate(1px,1px) rotate(.8deg)}
        58%{transform:translate(3px,-1px) rotate(2deg)}
        78%{transform:translate(-1px,1px) rotate(-1deg)}
      }
      @keyframes waveTalk{
        0%,42%,100%{transform:rotate(0deg)}
        54%{transform:rotate(-10deg)}
        66%{transform:rotate(8deg)}
        78%{transform:rotate(-7deg)}
        88%{transform:rotate(4deg)}
      }
      @keyframes eyeLeftLife{
        0%,8%,100%{transform:translateY(0) scaleX(1) scaleY(1) rotate(-2deg)}
        16%{transform:translateY(1px) scaleX(1.06) scaleY(.62) rotate(-8deg)}
        26%{transform:translateY(-1px) scaleX(.96) scaleY(1.08) rotate(-3deg)}
        38%{transform:translateY(1px) scaleX(1.08) scaleY(.72) rotate(-5deg)}
        50%{transform:translateY(2px) scaleX(1.10) scaleY(.52) rotate(4deg)}
        60%{transform:translateY(0) scaleX(1) scaleY(.08) rotate(-2deg)}
        64%{transform:translateY(0) scaleX(1) scaleY(1) rotate(-2deg)}
        76%{transform:translateY(-1px) scaleX(1.04) scaleY(.78) rotate(-7deg)}
        88%{transform:translateY(0) scaleX(.98) scaleY(1.04) rotate(-1deg)}
      }
      @keyframes eyeRightLife{
        0%,8%,100%{transform:translateY(0) scaleX(1) scaleY(1) rotate(2deg)}
        16%{transform:translateY(1px) scaleX(1.06) scaleY(.62) rotate(8deg)}
        26%{transform:translateY(-1px) scaleX(.96) scaleY(1.08) rotate(3deg)}
        38%{transform:translateY(1px) scaleX(1.08) scaleY(.72) rotate(5deg)}
        50%{transform:translateY(2px) scaleX(1.10) scaleY(.52) rotate(-4deg)}
        60%{transform:translateY(0) scaleX(1) scaleY(.08) rotate(2deg)}
        64%{transform:translateY(0) scaleX(1) scaleY(1) rotate(2deg)}
        76%{transform:translateY(-1px) scaleX(1.04) scaleY(.78) rotate(7deg)}
        88%{transform:translateY(0) scaleX(.98) scaleY(1.04) rotate(1deg)}
      }
      @keyframes mouthGlow{0%,100%{opacity:.92}50%{opacity:1}}
    </style>
  </defs>
  <circle cx="200" cy="160" r="140" fill="url(#cyanGlowTalk)" opacity=".40"/>
  <g class="body-talk">
    <path d="M140,240 C140,210 260,210 260,240 C260,280 140,280 140,240 Z" fill="url(#headBodyGradTalk)"/>
    <path d="M125,230 Q105,250 115,270" stroke="url(#headBodyGradTalk)" stroke-width="24" stroke-linecap="round" fill="none"/>
    <g class="waving-arm-talk">
      <path d="M275,230 Q315,200 300,165" stroke="url(#headBodyGradTalk)" stroke-width="26" stroke-linecap="round" fill="none"/>
      <circle cx="300" cy="160" r="16" fill="url(#headBodyGradTalk)"/>
      <path d="M315,135 Q325,140 330,150" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#neonGlowTalk)"/>
      <path d="M325,125 Q338,132 342,145" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#neonGlowTalk)"/>
    </g>
  </g>
  <g class="head-talk">
    <rect x="80" y="60" width="240" height="170" rx="85" fill="url(#headBodyGradTalk)"/>
    <rect x="102" y="80" width="196" height="130" rx="65" fill="url(#screenGradTalk)" stroke="#1e293b" stroke-width="3"/>
    <ellipse class="eye-left" cx="160" cy="136" rx="14" ry="16" fill="#00f3ff" filter="url(#neonGlowTalk)"/>
    <ellipse class="eye-right" cx="240" cy="136" rx="14" ry="16" fill="#00f3ff" filter="url(#neonGlowTalk)"/>
    <g class="mouth-bars" filter="url(#softGlowTalk)" fill="#53fbff">
      <rect x="172" y="171" width="7" height="6" rx="2"><animate attributeName="y" values="171;167;173;169;171" dur=".44s" repeatCount="indefinite"/><animate attributeName="height" values="6;14;3;10;6" dur=".44s" repeatCount="indefinite"/></rect>
      <rect x="184" y="168" width="7" height="12" rx="2"><animate attributeName="y" values="168;172;165;170;168" dur=".37s" repeatCount="indefinite"/><animate attributeName="height" values="12;4;17;8;12" dur=".37s" repeatCount="indefinite"/></rect>
      <rect x="196" y="165" width="7" height="18" rx="2"><animate attributeName="y" values="165;171;166;163;165" dur=".50s" repeatCount="indefinite"/><animate attributeName="height" values="18;6;15;20;18" dur=".50s" repeatCount="indefinite"/></rect>
      <rect x="208" y="168" width="7" height="12" rx="2"><animate attributeName="y" values="168;165;172;169;168" dur=".41s" repeatCount="indefinite"/><animate attributeName="height" values="12;16;4;10;12" dur=".41s" repeatCount="indefinite"/></rect>
      <rect x="220" y="171" width="7" height="6" rx="2"><animate attributeName="y" values="171;169;174;167;171" dur=".46s" repeatCount="indefinite"/><animate attributeName="height" values="6;10;3;13;6" dur=".46s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>