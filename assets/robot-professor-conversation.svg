<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 30 300 270" width="100%" height="100%" role="img" aria-label="Robô professor em conversa">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#00a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#001f3f"/>
    </linearGradient>
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .waving-arm{transform-box:fill-box;transform-origin:20% 70%;animation:wave 2.8s ease-in-out infinite}
      @keyframes wave{0%,58%,100%{transform:rotate(0deg)}65%{transform:rotate(-9deg)}72%{transform:rotate(8deg)}79%{transform:rotate(-7deg)}86%{transform:rotate(4deg)}}
    </style>
  </defs>
  <circle cx="200" cy="160" r="140" fill="url(#cyanGlow)" opacity="0.35"/>
  <path d="M140,240 C140,210 260,210 260,240 C260,280 140,280 140,240 Z" fill="url(#headBodyGrad)"/>
  <path d="M125,230 Q105,250 115,270" stroke="url(#headBodyGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
  <g class="waving-arm">
    <path d="M275,230 Q315,200 300,165" stroke="url(#headBodyGrad)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="300" cy="160" r="16" fill="url(#headBodyGrad)"/>
    <path d="M315,135 Q325,140 330,150" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#neonGlow)"/>
    <path d="M325,125 Q338,132 342,145" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#neonGlow)"/>
  </g>
  <rect x="80" y="60" width="240" height="170" rx="85" fill="url(#headBodyGrad)"/>
  <rect x="102" y="80" width="196" height="130" rx="65" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="3"/>
</svg>
