<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Inglês · Diagnóstico GPT</title><style>
body{background:#09111c;color:#edf5fc;font:16px system-ui,sans-serif;max-width:520px;margin:40px auto;padding:18px}main{background:#122136;border:1px solid #294c64;border-radius:18px;padding:22px}h1{font-size:22px}button{background:#197cba;color:white;border:0;border-radius:12px;padding:13px 16px;font-weight:700}p{line-height:1.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:12px;background:#071421}small{color:#9cb8cf}</style></head><body><main><h1>Meu Inglês — teste isolado do GPT</h1><p>Esta página verifica a comunicação com o Supabase sem pedir senha e sem realizar chamadas ao modelo de IA.</p><button id="check" type="button">Verificar conexão</button><pre id="status" role="status">Aguardando teste.</pre><small>A conversa GPT do aplicativo principal permanece intacta. Não digite chaves nem senhas nesta página.</small></main><script>
const endpoint='https://bewdladkzgceerhkshbt.supabase.co/functions/v1/meu-ingles-gpt-test';
const existingEndpoint='https://meu-ingles-claudio.netlify.app/api/groq-chat';
document.getElementById('check').onclick=async()=>{const output=document.getElementById('status');output.textContent='Verificando os dois serviços, sem mensagens de IA...';const checks=[['Supabase (novo teste)',endpoint,'OPTIONS'],['Netlify (conversa já existente)',existingEndpoint,'GET']];const results=[];for(const [name,url,method] of checks){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),9000);let r;try{r=await fetch(url,{method,signal:c.signal});}finally{clearTimeout(t)}results.push(name+': HTTP '+r.status+(r.ok?' — respondeu':' — verificar'));}catch(e){results.push(name+': falha de conexão ('+String(e?.message||e)+')');}}output.textContent=results.join('\\n')+'\\n\\nEste teste NÃO valida conversas, áudio nem chaves de API.';};
</script></body></html>
